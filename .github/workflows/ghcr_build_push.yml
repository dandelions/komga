name: Build and Push Komga to GHCR and Docker Hub

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 设置构建环境 (参考 DEVELOPING.md)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup WebUI node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'komga-webui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'komga-webui/package-lock.json'

      - name: Build WebUI
        working-directory: komga-webui
        run: |
          npm ci
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Setup NextUI node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'next-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'next-ui/package-lock.json'

      - name: Build NextUI
        working-directory: next-ui
        run: |
          npm ci
          npm run build:with-i18n

      - name: Build JAR (copy webui + nextui, no tests)
        run: |
          ./gradlew webuiCopyIndex nextuiCopyIndex
          # 用 assemble 编译 JAR，不触发任何测试
          ./gradlew assemble

      # 3. 准备 Docker 构建环境
      - name: Validate and format Docker Hub username
        id: dockerhub-repo
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
        run: |
          CLEAN_USER=$(echo -n "$DOCKER_USER" | tr -d '\r\n ' | tr '[:upper:]' '[:lower:]')
          if [[ "$CLEAN_USER" == *"@"* ]]; then
            echo "::error::DOCKERHUB_USERNAME 包含了 '@'（疑似填成了注册邮箱）。Docker 镜像命名空间必须是 Docker Hub 的用户名而非邮箱，请在 GitHub Secrets 中更新！"
            exit 1
          fi
          if [[ -z "$CLEAN_USER" ]]; then
            echo "::error::未检测到 DOCKERHUB_USERNAME 或 DOCKER_USERNAME，请在 GitHub Secrets 中配置！"
            exit 1
          fi
          echo "namespace=$CLEAN_USER" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub-repo.outputs.namespace }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub-repo.outputs.namespace }}/komga
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # 5. 构建并推送镜像
      # 注意：此步骤假设您的 Dockerfile 基础镜像是 ubuntu 并安装了 shell 工具
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 如果项目中没有现成 Dockerfile，可以通过 build-args 或直接在代码仓库创建
          file: ./Dockerfile

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-artifacts
          jar_file="$(find komga/build/libs -maxdepth 1 -type f -name 'komga-*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$jar_file"
          cp "$jar_file" "release-artifacts/komga-${GITHUB_REF_NAME#v}.jar"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*.jar
          body: |
            Docker images:
            - `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - `${{ steps.dockerhub-repo.outputs.namespace }}/komga:${{ github.ref_name }}`
